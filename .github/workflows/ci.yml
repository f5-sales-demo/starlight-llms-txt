name: CI

on:
  pull_request:
    branches: [main]

# Read-only: both jobs only check out, install and run tests or a docs build.
# Nothing here writes to the repository or calls the API.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64, starlight-llms-txt, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm i
      - run: pnpm --filter @f5-sales-demo/starlight-llms-txt test
  smoke:
    name: Smoke test (docs build)
    runs-on: [self-hosted, Linux, X64, starlight-llms-txt, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm i
      - run: pnpm --filter ./docs build
